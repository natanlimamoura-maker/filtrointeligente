<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Técnico de Filtros - Alcantara's Diesel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-10 select-none">

    <!-- CABEÇALHO DA OFICINA -->
    <header class="bg-gradient-to-r from-red-700 to-red-600 p-5 shadow-2xl flex justify-between items-center border-b border-red-500/30 sticky top-0 z-30">
        <div>
            <h1 class="text-lg font-black italic tracking-wider text-white flex items-center gap-2">
                <i class="fa-solid fa-filter text-red-200"></i> CONVERSOR DE FILTROS
            </h1>
            <p class="text-[10px] text-red-100/80 uppercase font-bold tracking-widest">Alcantara's Diesel - Consulta IA Online</p>
        </div>
        <button type="button" id="btn-limpar-topo" class="bg-red-950/80 hover:bg-red-900 text-red-200 p-2.5 rounded-xl border border-red-400/30 flex items-center justify-center transition active:scale-95">
            <i class="fa-solid fa-rotate text-xs"></i>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- CAIXA DE BUSCA PRINCIPAL -->
        <div class="bg-slate-900/90 p-5 rounded-3xl shadow-2xl border border-slate-800 space-y-3 backdrop-blur-md">
            <label class="text-xs font-bold text-slate-400 uppercase tracking-wide flex justify-between">
                <span>Código do Filtro, Motor ou Veículo</span>
                <span class="text-red-500 font-normal italic text-[10px]">IA Online Gemini</span>
            </label>
            <div class="relative flex items-center">
                <input type="text" id="input-busca" placeholder="EX: PSC76, FS1000, P550774, ISB 5.9..." class="w-full bg-slate-950 border border-slate-800 p-4 pr-16 rounded-2xl font-black text-red-400 placeholder:text-slate-600 text-lg uppercase focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                <button type="button" id="btn-buscar" class="absolute right-2 bg-red-600 hover:bg-red-500 text-white px-4 py-3 rounded-xl font-bold text-sm flex items-center gap-2 transition active:scale-95 shadow-lg">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <div class="flex justify-between items-center text-[10px] text-slate-500 italic">
                <span>Pesquisa em tempo real qualquer filtro ou caminhão.</span>
                <button type="button" id="btn-limpar-texto" class="text-red-400 hover:underline font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-arrows-rotate text-[9px]"></i> Limpar Cache
                </button>
            </div>
        </div>

        <!-- ÁREA DE EXIBIÇÃO DE RESULTADOS -->
        <div id="container-resultado" class="space-y-4">
            <!-- Resultados injetados via JS -->
        </div>

    </main>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6LvFe6D9VEmRitdTV2kKUw8hNirY3UYHStc73oHBTmsHg";

        async function buscarOnline() {
            var input = document.getElementById('input-busca');
            var container = document.getElementById('container-resultado');
            if (!input || !container) return;

            var termo = input.value.toUpperCase().trim();
            if (!termo) {
                alert('Digite um código de filtro ou aplicação!');
                return;
            }

            container.innerHTML = '<div class="text-center py-8 text-slate-400 space-y-2">' +
                '<i class="fa-solid fa-spinner fa-spin text-2xl text-red-500"></i>' +
                '<p class="text-xs font-bold uppercase tracking-wider">Consultando catálogo técnico online para "' + termo + '"...</p>' +
            '</div>';

            const prompt = `Você é um engenheiro especialista em filtros automotivos e de motores diesel (linha pesada, agrícola, utilitários e geradores).
O usuário pesquisou pelo termo: "${termo}".
Analise de qual filtro se trata e responda EXCLUSIVAMENTE em formato JSON VÁLIDO (sem bloco de código markdown, sem \`\`\`json).

Estrutura exata do JSON:
{
  "principal": "Código e Marca Principal (ex: TECFIL PSC76)",
  "categoria": "Combustível, Óleo, Ar ou Separador Racor",
  "tipo": "Descrição detalhada (ex: Filtro Blindado Diesel Injeção Eletrônica)",
  "motor": "Motorização exata (ex: Cummins ISC 8.3L / ISL 8.9L)",
  "aplicacaoOficial": "Lista de veículos e modelos compatíveis (ex: Ford Cargo 1932, 2632 | VW Constellation 19.320, 25.320)",
  "equivalencias": {
    "TECFIL": "Código",
    "MANN-FILTER": "Código",
    "FLEETGUARD": "Código",
    "DONALDSON": "Código",
    "PARKER / RACOR": "Código",
    "MAHLE": "Código",
    "WEGA": "Código",
    "FRAM": "Código"
  }
}

Regras rígidas de engenharia:
1. Certifique-se de diferenciar motores da mesma família (ex: Cummins ISB 3.9/5.9 vs Cummins ISC 8.3 / ISL 8.9).
2. Se o código inserido for de alguma marca específica (como Donaldson, Fleetguard, Mann, etc.), traga as conversões equivalentes exatas das outras marcas.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error('Falha na conexão online.');
                }

                const data = await response.json();
                let textResult = data.candidates[0].content.parts[0].text;
                
                textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                const item = JSON.parse(textResult);

                container.innerHTML = '';
                renderizarCard(item, "RESULTADO IA ONLINE");

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-3 text-center shadow-xl">' +
                    '<i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl"></i>' +
                    '<h3 class="font-black text-slate-200 text-sm">Erro na consulta online</h3>' +
                    '<p class="text-xs text-slate-400 leading-relaxed">Não foi possível consultar o filtro "' + termo + '". Verifique sua conexão com a internet ou tente novamente.</p>' +
                '</div>';
            }
        }

        function renderizarCard(item, fonte) {
            var container = document.getElementById('container-resultado');
            var equivalenciasHTML = '';
            
            if (item.equivalencias) {
                for (var marca in item.equivalencias) {
                    var cod = item.equivalencias[marca];
                    if (cod) {
                        equivalenciasHTML += '<div onclick="window.copiarTxt(\'' + cod + '\')" class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer hover:border-red-500 transition">' +
                            '<span class="text-[11px] font-bold text-slate-400">' + marca + '</span>' +
                            '<strong class="text-xs font-black text-white font-mono">' + cod + ' <i class="fa-regular fa-copy text-[10px] text-slate-500"></i></strong>' +
                        '</div>';
                    }
                }
            }

            var html = '<div class="bg-slate-900 border border-red-500/30 p-5 rounded-3xl shadow-2xl space-y-4">' +
                '<div class="flex justify-between items-start border-b border-slate-800 pb-3">' +
                    '<div>' +
                        '<div class="flex items-center gap-2">' +
                            '<span class="text-[9px] font-black bg-red-950 text-red-400 px-2.5 py-0.5 rounded-full border border-red-800 uppercase">' + fonte + '</span>' +
                            '<span class="text-[9px] font-bold bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full uppercase">' + (item.categoria || 'FILTRO') + '</span>' +
                        '</div>' +
                        '<h2 class="text-xl font-black italic text-red-500 mt-1.5">' + (item.principal || 'RESULTADO') + '</h2>' +
                        '<p class="text-[11px] text-slate-300 font-semibold">' + (item.tipo || '') + '</p>' +
                    '</div>' +
                '</div>' +
                '<div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-2">' +
                    '<div><span class="text-[10px] font-bold text-red-400 uppercase block">Motorização Exata</span><p class="text-xs font-black text-slate-100">' + (item.motor || 'N/A') + '</p></div>' +
                    '<div class="pt-2 border-t border-slate-800"><span class="text-[10px] font-bold text-slate-400 uppercase block">Aplicação em Veículos</span><p class="text-xs font-medium text-slate-300 leading-relaxed">' + (item.aplicacaoOficial || 'N/A') + '</p></div>' +
                '</div>' +
                '<div class="space-y-2"><span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Conversão Cruzada (Toque p/ copiar)</span><div class="grid grid-cols-1 gap-1.5">' + equivalenciasHTML + '</div></div>' +
                '<button type="button" onclick="window.copiarResumo(\'' + item.principal + '\', \'' + item.motor + '\', \'' + item.aplicacaoOficial + '\')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3.5 rounded-2xl border border-slate-700 transition uppercase text-xs flex items-center justify-center gap-2">' +
                    '<i class="fa-solid fa-share-nodes text-red-400"></i> Copiar Resumo para WhatsApp' +
                '</button>' +
            '</div>';

            container.innerHTML = html;
        }

        window.copiarTxt = function(txt) {
            if (navigator.clipboard) navigator.clipboard.writeText(txt);
            alert('Copiado: ' + txt);
        };

        window.copiarResumo = function(filtro, motor, aplicacao) {
            var txt = "*Alcantara's Diesel - Consulta de Filtro*\n\n📌 *Filtro Ref:* " + filtro + "\n⚙️ *Motor:* " + motor + "\n🚛 *Aplicação:* " + aplicacao;
            if (navigator.clipboard) navigator.clipboard.writeText(txt);
            alert('Resumo copiado!');
        };

        function resetarCache() {
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    names.forEach(function(name) { caches.delete(name); });
                });
            }
            localStorage.clear();
            sessionStorage.clear();
            alert('Cache limpo!');
            window.location.reload(true);
        }

        window.onload = function() {
            var btnBuscar = document.getElementById('btn-buscar');
            var inputBusca = document.getElementById('input-busca');
            var btnLimparTopo = document.getElementById('btn-limpar-topo');
            var btnLimparTexto = document.getElementById('btn-limpar-texto');

            if (btnBuscar) btnBuscar.onclick = buscarOnline;
            if (btnLimparTopo) btnLimparTopo.onclick = resetarCache;
            if (btnLimparTexto) btnLimparTexto.onclick = resetarCache;

            if (inputBusca) {
                inputBusca.onkeyup = function(e) {
                    if (e.key === 'Enter' || e.keyCode === 13) buscarOnline();
                };
            }
        };
    </script>
</body>
</html>
